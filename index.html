<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the safe-area
         insets in App.css put the HUD back inside it. user-scalable=no because
         a double-tap zoom mid-run leaves the canvas mis-scaled and there is
         nothing here to read closely. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- Added to the home screen, the game runs without browser chrome. In the
         recorded iPhone session Chrome's URL bar, its bottom nav and the
         persistent mic chip took roughly a fifth of the screen (spec B6). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlappyTone" />
    <!-- black-translucent draws the app under the status bar, which is why the
         safe-area padding is not optional. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>FlappyTone</title>

    <!-- Link previews. og:image must be absolute — a relative path silently
         fails on every scraper. The image is generated from
         src/dev/og-source.svg; see docs/BRAND.md to regenerate it.
         The description says "tone contour", not "pronunciation": humming
         beats the game and there is no syllable verification (PRD §11). -->
    <meta name="description" content="Steer a bird with your voice through corridors shaped like Mandarin tone marks. A browser-based tone contour trainer." />
    <meta property="og:title" content="FlappyTone — Mandarin tone trainer" />
    <meta property="og:description" content="Your voice is the controller. Fly through corridors shaped like Mandarin tone marks — your pitch is the flight path." />
    <meta property="og:image" content="https://flappytone.pierrebuilds.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A glowing pitch trail tracing a Tone 3 contour through a corridor shaped like the ˇ tone mark." />
    <meta property="og:url" content="https://flappytone.pierrebuilds.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlappyTone" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
