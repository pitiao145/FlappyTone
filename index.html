<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for anything that will not take an SVG favicon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <!-- viewport-fit=cover: safe-area insets in App.css depend on it.
         user-scalable=no: double-tap zoom mid-run mis-scales the canvas. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- Home-screen install runs without browser chrome (spec B6). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#100d0e" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlappyTone" />
    <!-- black-translucent draws under the status bar; safe-area padding is required. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Matches brand.headline. -->
    <title>Practice Mandarin Tones With Your Voice — FlappyTone</title>
    <!-- Not ?app=1 — that's the PWA start_url, never the canonical. -->
    <link rel="canonical" href="https://flappytone.com/" />

    <!-- og:image must be absolute — relative paths silently fail on scrapers.
         Regenerate from src/dev/og-source.svg per docs/BRAND.md. -->
    <meta name="description" content="Steer a bird with your voice through corridors shaped like Mandarin tone marks. A browser-based tone contour trainer." />
    <meta property="og:title" content="FlappyTone — Gamified tone practicing" />
    <meta property="og:description" content="A visual way to learn the Mandarin tones." />
    <meta property="og:image" content="https://flappytone.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pip the bird tracing a Tone 3 contour through a corridor shaped like the ˇ tone mark." />
    <meta property="og:url" content="https://flappytone.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlappyTone" />
    <!-- No twitter:title/description/image: falls back to og: tags, avoids drift. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- SoftwareApplication only — Google deprecated FAQ rich results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FlappyTone",
        "description": "Steer a bird with your voice through corridors shaped like Mandarin tone marks. A browser-based tone contour trainer.",
        "url": "https://flappytone.com/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <!-- Filled at build time by src/dev/prerender.ts; React remounts over it. -->
    <div id="root"></div>
    <!-- Legacy home-screen installs only.
         The manifest's start_url is /app now, but anyone who installed before
         the split has "/" or "/?app=1" saved, and launching the installed app
         onto marketing copy every time would be a bug. This forwards them.

         It is the only place left that reads these flags — the pair that used
         to be kept in sync by hand (this script and initialScreen() in
         App.tsx) is gone, because "/" is now only ever the marketing page.
         Safe to delete once installs from before the split have aged out.

         The standalone checks match on *every* load of "/" inside an installed
         app, not only the launch — including a deliberate tap on the game's
         own link out to the marketing site, which would otherwise bounce
         straight back here and read as a dead link. "?site" is that link's way
         of saying it meant it, and it wins over the redirect.

         Inline and blocking on purpose: it must beat the paint. A plain visit
         to "/" in a browser tab matches none of these and is untouched. -->
    <script>
      try {
        var q = new URLSearchParams(location.search);
        if (
          !q.has("site") &&
          (q.has("app") ||
            matchMedia("(display-mode: standalone)").matches ||
            navigator.standalone === true)
        ) {
          location.replace("/app");
        }
      } catch (e) {
        /* leave it: a painted landing page beats a blank screen */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
