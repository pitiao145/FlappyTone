<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for anything that will not take an SVG favicon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the safe-area
         insets in App.css put the HUD back inside it. user-scalable=no because
         a double-tap zoom mid-run leaves the canvas mis-scaled and there is
         nothing here to read closely. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- Added to the home screen, the game runs without browser chrome. In the
         recorded iPhone session Chrome's URL bar, its bottom nav and the
         persistent mic chip took roughly a fifth of the screen (spec B6). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#100d0e" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlappyTone" />
    <!-- black-translucent draws the app under the status bar, which is why the
         safe-area padding is not optional. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Says what the thing is, not just what it is called: "FlappyTone" is a
         coined word nobody searches for. Matches brand.headline. -->
    <title>Practice Mandarin Tones With Your Voice — FlappyTone</title>
    <!-- The bare URL, deliberately not ?app=1 — that variant is the PWA
         start_url and must never become the canonical. -->
    <link rel="canonical" href="https://flappytone.pierrebuilds.dev/" />

    <!-- Link previews. og:image must be absolute — a relative path silently
         fails on every scraper. The image is generated from
         src/dev/og-source.svg; see docs/BRAND.md to regenerate it.
         The description says "tone contour", not "pronunciation": humming
         beats the game and there is no syllable verification (PRD §11). -->
    <meta name="description" content="Steer a bird with your voice through corridors shaped like Mandarin tone marks. A browser-based tone contour trainer." />
    <meta property="og:title" content="FlappyTone — Mandarin tone trainer" />
    <meta property="og:description" content="Your voice is the controller. Fly through corridors shaped like Mandarin tone marks — your pitch is the flight path." />
    <meta property="og:image" content="https://flappytone.pierrebuilds.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A glowing pitch trail tracing a Tone 3 contour through a corridor shaped like the ˇ tone mark." />
    <meta property="og:url" content="https://flappytone.pierrebuilds.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlappyTone" />
    <!-- No twitter:title/description/image: the card spec falls back to the
         og: tags when they are absent, so adding them is the same copy in two
         places that can drift. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data. SoftwareApplication only — no FAQPage: Google
         deprecated FAQ rich results and it earns nothing now. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FlappyTone",
        "description": "Steer a bird with your voice through corridors shaped like Mandarin tone marks. A browser-based tone contour trainer.",
        "url": "https://flappytone.pierrebuilds.dev/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <!-- Filled at build time with the rendered landing page — see
         src/dev/prerender.ts. React replaces it with the same markup on mount. -->
    <div id="root"></div>
    <!-- Installed to the home screen this is the game, not the marketing page,
         so drop the prerendered landing before it is ever painted. Mirrors
         initialScreen() in App.tsx; blocking and inline on purpose, because
         anything deferred is a frame of the wrong page. -->
    <script>
      try {
        if (
          new URLSearchParams(location.search).has("app") ||
          matchMedia("(display-mode: standalone)").matches ||
          navigator.standalone === true
        ) {
          document.getElementById("root").replaceChildren();
        }
      } catch (e) {
        /* leave it: a painted landing page beats a blank screen */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
