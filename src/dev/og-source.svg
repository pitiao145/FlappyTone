<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- FlappyTone OG image sample — 1200x630.
       Safe area is the dashed rect at 100,65 → 1100,565: everything meaningful
       sits inside it, because Slack / iMessage / X each crop the edges
       differently. Delete the #safe group before exporting.
       Palette from src/render/palette.ts. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="vign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#05070a" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#05070a" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="trailFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="rgb(96,205,255)" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="rgb(96,205,255)" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="rgb(96,205,255)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#141821"/>

  <!-- Chao 1–5 guide grid, spanning the full width -->
  <g stroke="rgb(150,180,215)" stroke-width="1.5">
    <line x1="0" y1="160"   x2="1200" y2="160"   opacity="0.13"/>
    <line x1="0" y1="237.5" x2="1200" y2="237.5" opacity="0.07"/>
    <line x1="0" y1="315"   x2="1200" y2="315"   opacity="0.20"/>
    <line x1="0" y1="392.5" x2="1200" y2="392.5" opacity="0.07"/>
    <line x1="0" y1="470"   x2="1200" y2="470"   opacity="0.13"/>
  </g>

  <!-- ── The gate: a Tone 3 corridor ──────────────────────────────────
       Centreline is the measured polyline from PRD §6:
       (0,3) (0.45,1.2) (0.72,1.2) (1,5), mapped over x 580→1080. -->
  <g>
    <!-- corridor walls: the polyline offset by ±tolerance -->
    <path d="M580,269 L805,408.5 L940,408.5 L1080,114"
          fill="none" stroke="rgb(96,205,255)" stroke-width="2.5"
          opacity="0.30" stroke-linejoin="round"/>
    <path d="M580,361 L805,500.5 L940,500.5 L1080,206"
          fill="none" stroke="rgb(96,205,255)" stroke-width="2.5"
          opacity="0.30" stroke-linejoin="round"/>
    <!-- the passable gap -->
    <path d="M580,269 L805,408.5 L940,408.5 L1080,114 L1080,206 L940,500.5 L805,500.5 L580,361 Z"
          fill="rgb(96,205,255)" opacity="0.055"/>

    <!-- the ideal contour, dashed — the target the player is tracing -->
    <path d="M580,315 L805,454.5 L940,454.5 L1080,160"
          fill="none" stroke="rgb(235,208,170)" stroke-width="3"
          stroke-dasharray="10 12" stroke-linecap="round"
          opacity="0.55"/>
  </g>

  <!-- ── The player's actual pitch trail ──────────────────────────────
       Deliberately NOT identical to the target: it overshoots the dip,
       wobbles on the hold and rides slightly late on the climb. This is
       the whole product — a real contour against the ideal one. -->
  <path d="M580,321 C660,352 730,404 808,462
           C844,470 876,447 912,459
           C946,470 960,462 982,404
           C1010,330 1042,232 1078,166"
        fill="none" stroke="url(#trailFade)" stroke-width="7"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- the bird, at the head of the trail -->
  <circle cx="1078" cy="166" r="13" fill="#eaf7ff" filter="url(#glow)"/>
  <circle cx="1078" cy="166" r="26" fill="none" stroke="#eaf7ff"
          stroke-width="2" opacity="0.35" filter="url(#softglow)"/>

  <!-- darken the left so the type holds contrast over the grid -->
  <rect width="1200" height="630" fill="url(#vign)"/>

  <!-- ── Type ─────────────────────────────────────────────────────── -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- the syllable, as the HUD shows it -->
    <text x="100" y="212" font-size="34" font-weight="500"
          fill="rgb(235,208,170)" letter-spacing="1">mǎ 马 (3)</text>

    <text x="100" y="300" font-size="76" font-weight="700"
          fill="#f2f7ff" letter-spacing="-1.5">FlappyTone</text>

    <text x="100" y="358" font-size="36" font-weight="500"
          fill="rgb(96,205,255)">Your voice is the controller.</text>

    <!-- The honest framing, per PRD §11 — a contour trainer, not a
         pronunciation checker. Do not let this line overclaim. -->
    <text x="100" y="412" font-size="25" font-weight="400"
          fill="#9fb0c4">Fly through corridors shaped like Mandarin</text>
    <text x="100" y="446" font-size="25" font-weight="400"
          fill="#9fb0c4">tone marks. Your pitch is the flight path.</text>

    <text x="100" y="520" font-size="21" font-weight="500"
          fill="#67788c" letter-spacing="0.5">flappytone.pierrebuilds.dev</text>
  </g>

</svg>
