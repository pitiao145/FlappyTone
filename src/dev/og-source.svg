<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- FlappyTone OG image source — 1200x630.
       Safe area is roughly 100,65 → 1100,565: everything meaningful sits
       inside it, because Slack / iMessage / X each crop the edges
       differently.
       Palette: the current light "ink tones" theme (src/ui/tokens.css) —
       warm paper background, jade accent, gold beak. Pip's geometry and
       fills are copied 1:1 from src/render/scene.ts's drawPip() (flying
       state), just scaled up and rotated to sit at the head of the trail. -->
  <defs>
    <linearGradient id="trailFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="rgb(28,122,99)" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="rgb(28,122,99)" stop-opacity="0.75"/>
      <stop offset="1"    stop-color="rgb(28,122,99)" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="pipHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgb(28,122,99)" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="rgb(28,122,99)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="rgb(28,122,99)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#f7f1e3"/>

  <!-- Chao 1–5 guide grid, spanning the full width — same colour/opacity
       convention as drawChaoGrid() (src/render/scene.ts), chao 3 brightest
       as the rest line. -->
  <g stroke="rgb(60,52,42)" stroke-width="1.5">
    <line x1="0" y1="160"   x2="1200" y2="160"   opacity="0.30"/>
    <line x1="0" y1="237.5" x2="1200" y2="237.5" opacity="0.20"/>
    <line x1="0" y1="315"   x2="1200" y2="315"   opacity="0.45"/>
    <line x1="0" y1="392.5" x2="1200" y2="392.5" opacity="0.20"/>
    <line x1="0" y1="470"   x2="1200" y2="470"   opacity="0.30"/>
  </g>

  <!-- ── The gate: a Tone 3 corridor ──────────────────────────────────
       Centreline is the measured polyline from PRD §6:
       (0,3) (0.45,1.2) (0.72,1.2) (1,5), mapped over x 580→1080. -->
  <g>
    <!-- corridor walls: the polyline offset by ±tolerance -->
    <path d="M580,269 L805,408.5 L940,408.5 L1080,114"
          fill="none" stroke="rgb(28,122,99)" stroke-width="2.5"
          opacity="0.35" stroke-linejoin="round"/>
    <path d="M580,361 L805,500.5 L940,500.5 L1080,206"
          fill="none" stroke="rgb(28,122,99)" stroke-width="2.5"
          opacity="0.35" stroke-linejoin="round"/>
    <!-- the passable gap -->
    <path d="M580,269 L805,408.5 L940,408.5 L1080,114 L1080,206 L940,500.5 L805,500.5 L580,361 Z"
          fill="rgb(28,122,99)" opacity="0.06"/>

    <!-- the ideal contour, dashed — the target the player is tracing -->
    <path d="M580,315 L805,454.5 L940,454.5 L1080,160"
          fill="none" stroke="rgb(168,108,32)" stroke-width="3"
          stroke-dasharray="10 12" stroke-linecap="round"
          opacity="0.6"/>
  </g>

  <!-- ── The player's actual pitch trail ──────────────────────────────
       Deliberately NOT identical to the target: it overshoots the dip,
       wobbles on the hold and rides slightly late on the climb. This is
       the whole product — a real contour against the ideal one. -->
  <path d="M580,321 C660,352 730,404 808,462
           C844,470 876,447 912,459
           C946,470 960,462 982,404
           C1010,330 1042,232 1078,166"
        fill="none" stroke="url(#trailFade)" stroke-width="6"
        stroke-linecap="round"/>

  <!-- ── Pip, at the head of the trail ──────────────────────────────
       Geometry/fills copied from drawPip()'s "flying" state (scene.ts):
       beak tip is the anchor at (0,0), rotated to face along the trail's
       own direction of travel, scaled up ~3.5x from game size for OG
       legibility. -->
  <g transform="translate(1078,166) rotate(-52) scale(3.5)">
    <circle cx="-17.25" cy="0" r="30" fill="url(#pipHalo)"/>
    <circle cx="-17.25" cy="0" r="11" fill="rgb(51,135,115)"/>
    <path d="M -24.07,3.85 A 6.82,6.82 0 0 0 -10.43,3.85 Z"
          fill="rgb(142,189,177)" opacity="0.5"/>
    <path d="M -8,-3.5 L 0,0 L -8,3.5 Z" fill="#c98a3c"/>
    <circle cx="-15.05" cy="-4.4" r="2.6" fill="#f7f1e3"/>
    <circle cx="-13.85" cy="-4.4" r="1.2" fill="#241d15"/>
  </g>

  <!-- ── Type ─────────────────────────────────────────────────────── -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="100" y="255" font-size="76" font-weight="700"
          fill="#241d15" letter-spacing="-1.5">FlappyTone</text>

    <text x="100" y="313" font-size="36" font-weight="500"
          fill="#1c7a63">Gamified tone practicing.</text>

    <!-- The honest framing, per PRD §11 — a contour trainer, not a
         pronunciation checker. Do not let this line overclaim. -->
    <text x="100" y="367" font-size="25" font-weight="400"
          fill="#6b6151">A visual way to learn the Mandarin tones.</text>

    <text x="100" y="520" font-size="21" font-weight="500"
          fill="#857a65" letter-spacing="0.5">flappytone.com</text>
  </g>

</svg>
