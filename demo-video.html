<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo video render (dev only)</title>
    <!-- Dev-only tool, same convention as pip-export.html (CLAUDE.md #7):
         absent from vite.config.ts's build.rollupOptions.input, so
         `npm run build` never emits it. Driven by src/dev/render-demo.ts. -->
    <meta name="robots" content="noindex" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; overflow: hidden; background: var(--canvas-backdrop, #eee4cc); }
      #root .game-screen { position: fixed; inset: 0; display: block; }
      #root .game-stage, #root .game-stage canvas { margin: 0; border-radius: 0 !important; box-shadow: none; }
      /* Marketing-only overlays: not part of the game, styled from its tokens. */
      .demo-caption {
        position: absolute; left: 0; right: 0; bottom: 9%; padding: 0 16px;
        text-align: center; font-family: var(--font-display); font-weight: 600;
        font-size: 24px; color: var(--ink, #241d15); pointer-events: none;
      }
      .demo-end { position: absolute; inset: 0; overflow: hidden; background: var(--surface, #f7f1e3); }
      .demo-end .gameover-screen { min-height: 100%; padding: 16px 12px; box-sizing: border-box; }
      .demo-share { display: flex; align-items: center; justify-content: center; padding: 24px; }
      .demo-share img { max-width: 100%; max-height: 100%; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
      .demo-card {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px; padding: 0 24px;
        background: var(--surface, #f7f1e3); text-align: center;
      }
      .demo-card h1 { margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--ink, #241d15); }
      .demo-card p { margin: 0; font-family: var(--font); font-size: 20px; color: var(--accent, #1c7a63); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/demoVideo/page.tsx"></script>
  </body>
</html>
