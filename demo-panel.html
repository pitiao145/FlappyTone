<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo panel render (dev only)</title>
    <!-- Dev-only, like demo-video.html: not a build input. Driven by src/dev/render-demo.ts. -->
    <meta name="robots" content="noindex" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; overflow: hidden; background: var(--surface, #f7f1e3); }
      .demo-panel-frame { position: fixed; inset: 0; overflow: hidden; background: var(--surface, #f7f1e3);
        display: flex; flex-direction: column; justify-content: center; }
      .demo-panel { box-sizing: border-box; padding: 16px 12px; min-height: 0 !important; margin: 0 !important; }
      .demo-panel .progress-card { margin-bottom: 10px; }
      .demo-panel .tone-average-card figcaption { margin-top: 2px !important; }
      .demo-panel .tone-average-card .syllable { font-size: 16px; }
      .demo-panel.visualiser-screen { height: auto !important; padding: 0; }
      .demo-panel .tone-average-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      .demo-panel .tone-average-card { margin: 0 !important; padding: 6px !important; border: 0 !important; }
      .demo-panel .tone-average-card canvas { width: 100% !important; height: auto !important; }
      .demo-panel .progress-card { padding: 14px !important; }
      .demo-panel .progress-card-header h3 { font-size: 20px; }
      .vis-target-word { text-align: center; font-family: var(--font-display); font-size: 22px; color: var(--ink); margin: 6px 0 10px; }
      .vis-target-word .hanzi { font-size: 26px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/demoVideo/panel.tsx"></script>
  </body>
</html>
