name = "flappytone-clips-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
routes = [{ pattern = "clips.flappytone.com", custom_domain = true }]

[[r2_buckets]]
binding = "RAW"
bucket_name = "flappytone-raw"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "flappytone-clips"

[vars]
ALLOWED_ORIGINS = "https://flappytone.com,https://www.flappytone.com,https://*.vercel.app,http://localhost:5173,https://localhost:5173"

# Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CLIP_TOKEN_SECRET,
# RECORD_PASSCODE) are set with `wrangler secret put` — never here, and never
# in any committed file.

# Per-IP budget on the passcode routes (/auth, /raw, /booth/words), checked in
# src/index.ts before the code is compared. 30 a minute is well above a booth
# session's upload rate. This limit is approximate: counts are per machine and
# sync in the background, so in a live test (Oct 2026) 170 guesses from one IP
# never got a 429. Do not rely on it against guessing; a strict limit needs a
# Durable Object or a WAF rule. namespace_id only has to be unique in this account.
[[ratelimits]]
name = "PASSCODE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
