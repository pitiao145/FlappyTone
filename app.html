<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for anything that will not take an SVG favicon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <!-- viewport-fit=cover: safe-area insets in App.css depend on it.
         user-scalable=no: double-tap zoom mid-run mis-scales the canvas. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- The game is a JS shell with no indexable content; the landing page at /
         carries all the SEO. Mirrored by X-Robots-Tag in vercel.json and
         Disallow in robots.txt. -->
    <meta name="robots" content="noindex" />

    <!-- Home-screen install runs without browser chrome (spec B6). The manifest
         lives on this entry, not on /, because start_url is /app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f1e3" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlappyTone" />
    <!-- black-translucent draws under the status bar; safe-area padding is required. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>FlappyTone</title>

    <!-- Link previews. /app is noindex, but people still paste it into chats
         (and share links land here), and without these a scraper shows a bare
         URL or whatever it cached last. Mirrors index.html's og: block — keep
         the two in sync, including the ?v= cache-buster. -->
    <meta name="description" content="Steer a bird with your voice through corridors shaped like Mandarin tone marks. A browser-based tone contour trainer." />
    <meta property="og:title" content="FlappyTone — Gamified tone practicing" />
    <meta property="og:description" content="A visual way to learn the Mandarin tones." />
    <meta property="og:image" content="https://flappytone.com/og.png?v=2" />
    <meta property="og:image:secure_url" content="https://flappytone.com/og.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pip the bird tracing a Tone 3 contour through a corridor shaped like the ˇ tone mark." />
    <meta property="og:url" content="https://flappytone.com/app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlappyTone" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Never prerendered — src/dev/prerender.ts only touches index.html. -->
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
